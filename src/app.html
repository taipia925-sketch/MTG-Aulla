/* MTG Aulla
   Il tavolo è scuro e opaco (zinc-950): ogni giocatore ha un pannello con un filo e un alone del suo colore di mana,
   punti vita grandi in Inter, più e meno discreti ai bordi. Al centro due comandi: «Chiedi al Judge» e il menu.
   Gli strati (arbitro, dadi, impostazioni…) sono carte ingrandite: barra dorata del titolo e riquadro di testo. */
:root {
  --bg: #0f0d12; --surface: #18151c; --raised: #221d27; --sunken: #0b0a0d; --line: #2f2833; --line-2: #4b404f;

  --mark: rgba(230, 195, 116, .34); --mark-ink: #fff6de;
  --danger: #ff8f7d; --danger-btn: #b3261e; --ok: #86dba9; --focus: #ffd98a;

  --tex: radial-gradient(120% 70% at 50% -10%, rgba(230,195,116,.12), transparent 60%);
  /* colori: cornice (f1→f2), illustrazione (a1→a2), barra del nome (n), simbolo di mana (p), bagliore (g) */
  --Wf1: #efe7cf; --Wf2: #b9a77c; --Wa1: #d6a855; --Wa2: #4a3212; --Wn: #f6f1e2; --Wp: #f8f4d8; --Wg: #ffe9a8;
  --Uf1: #3f86c6; --Uf2: #123f6e; --Ua1: #1d5f9e; --Ua2: #040f22; --Un: #cfe1f1; --Up: #aed0ec; --Ug: #7cc4ff;
  --Bf1: #5a5058; --Bf2: #1a1519; --Ba1: #3b2747; --Ba2: #07050a; --Bn: #d3cbcd; --Bp: #c6bcb8; --Bg: #b78cff;
  --Rf1: #de6a42; --Rf2: #7d230f; --Ra1: #a1301a; --Ra2: #1d0503; --Rn: #f4ccb8; --Rp: #f2a383; --Rg: #ff9a52;
  --Gf1: #4f9c55; --Gf2: #1b4a21; --Ga1: #2c6b2f; --Ga2: #041206; --Gn: #cfe5c9; --Gp: #a4d3a9; --Gg: #b6f27a;
  --Mf1: #e9c66c; --Mf2: #8d6420; --Ma1: #8a6421; --Ma2: #1b1204; --Mn: #f5e6b6; --Mp: #f0d27a; --Mg: #ffe08a;
  --Cf1: #c3c7cc; --Cf2: #61666d; --Ca1: #59616b; --Ca2: #101317; --Cn: #e2e4e7; --Cp: #d3cdca; --Cg: #e6eef8;
  /* usati da storico e scelte (compatibilità) */
  --W1: #b9a37a; --W2: #7f6b48; --W3: #f7efdc; --U1: #2a6fb0; --U2: #0a2650; --U3: #5fa3e6; --B1: #4a3d55; --B2: #120d16; --B3: #9a86b0;
  --R1: #c0452a; --R2: #561307; --R3: #f08050; --G1: #3f7d2a; --G2: #12300a; --G3: #8fd04a; --M1: #b38a2e; --M2: #5c430d; --M3: #f0cc60; --C1: #7c8189; --C2: #2f3135; --C3: #c4c8ce;

}

  --mark: rgba(214,160,50,.3); --mark-ink: #241a10; --danger: #a8251c; --ok: #1d6b43; --focus: #7a5410;

/* ================= TAVOLO: scuro, opaco, minimale =================
   L'aspetto dei pannelli è scritto con le classi di Tailwind nei modelli JS; qui restano struttura, misure relative al pannello e transizioni. */
#game { position: fixed; inset: 0; overflow: hidden; background: #09090b; }

  padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.pl { position: relative; container-type: size; border-radius: clamp(18px, 6cqmin, 30px); overflow: hidden; isolation: isolate; background: #141417; color: #fafafa; font-family: var(--f-life);
  border: 1px solid rgb(var(--tint) / .22); user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: border-color .35s var(--ease), opacity .35s, filter .4s, box-shadow .35s var(--ease); }
.pl.up, .pl.dn { border-color: rgb(var(--tint) / .55); transition-duration: .06s; }
.pl.out { opacity: .55; filter: grayscale(.7); }
.pl.out .chips { display: none; }
.pl.pick { border-color: rgb(var(--tint)); box-shadow: 0 0 0 1px rgb(var(--tint)), 0 0 40px rgb(var(--tint) / .22); }
.board.dim .pl { opacity: .45; }
.seat { position: absolute; inset: 0; container-type: size;
  background: radial-gradient(75% 65% at 50% 50%, rgb(var(--tint) / .11), transparent 75%), linear-gradient(180deg, rgb(var(--tint) / .06), transparent 45%); }
.seat::after { content: ""; position: absolute; inset: clamp(5px, 1.8cqmin, 9px); border: 1px solid rgb(var(--tint) / .13); border-radius: calc(clamp(18px, 6cqmin, 30px) - clamp(5px, 1.8cqmin, 9px)); pointer-events: none; }
.seat.r180 { transform: rotate(180deg); }
.seat.r90, .seat.r270 { inset: auto; top: 50%; left: 50%; width: 100cqh; height: 100cqw; }
.seat.r90 { transform: translate(-50%, -50%) rotate(90deg); }
.seat.r270 { transform: translate(-50%, -50%) rotate(-90deg); }
.hit { touch-action: none; }
.sigil { position: absolute; left: 50%; top: 50%; width: min(120vmin, 860px); height: min(120vmin, 860px); transform: translate(-50%, -50%); pointer-events: none; opacity: .07; color: #d4d4d8; }
.sigil svg { width: 100%; height: 100%; fill: none; stroke: currentColor; }

.hit.press .ctl { transform: scale(.86); background-color: rgb(255 255 255 / .1); border-color: rgb(var(--tint) / .55); color: #fff; }
.life { font-size: min(46cqh, 31cqw); font-variant-numeric: tabular-nums; transition: transform .16s var(--ease); }
.life.k3 { font-size: min(36cqh, 23cqw); }

.delta { top: calc(50% - min(17cqh, 11.5cqw) - 38px); }
.delta.on { opacity: 1; } .delta.neg { color: #fda4af; } .delta.pos { color: #a7f3d0; }

.pl.nmbottom .chips { bottom: calc(5cqh + clamp(18px, 6.5cqh, 24px) + 8px); }
.pl.nmbottom .lifebox { padding-bottom: 22cqh; }
.pl.chside .chips { justify-content: flex-end; } .pl.chstart .chips { justify-content: flex-start; }
.chips { flex-wrap: nowrap; justify-content: safe center; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.front { transition: opacity .2s ease; }
.pl.flipped .front { opacity: 0; }
.back { opacity: 0; visibility: hidden; transform: scale(.985); transition: opacity .2s ease, transform .2s var(--ease), visibility 0s linear .2s; }
.pl.flipped .back { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(116px, 27cqw), 1fr)); grid-auto-rows: minmax(52px, 1fr); }
.cell.cmd.hot { border-color: rgb(253 164 175 / .6); }
@container (max-width: 330px) { .btab span { display: none; } }

  .cell { grid-template-columns: none; grid-template-rows: minmax(40px, 1fr) auto minmax(40px, 1fr) auto; min-height: 0; }

}
@media (prefers-reduced-motion: reduce) { .front, .back, .life, .pl, .hit .ctl { transition: none !important; } }
/* menu rapido */
.ringmenu { position: fixed; inset: 0; z-index: 11; }

.ringmenu.closed .scrim { opacity: 0; }

/* chiedi al judge: riquadro scuro e sobrio come il tavolo */
.panel.ask { background: #0c0c0e; border: 1px solid rgb(255 255 255 / .08); color: #fafafa; font-family: var(--f-life); }
.panel.ask::before { display: none; }

/* ================= STRATI = CARTE INGRANDITE ================= */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; }
.layer > .scrim { position: absolute; inset: 0; background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.panel { position: relative; color: var(--ink); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow), 0 0 0 1px #000;
  background: var(--tex), var(--bg); border: clamp(5px, 1.4vmin, 9px) solid #0a090b; }
.panel::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(230,195,116,.45), inset 0 0 0 4px rgba(0,0,0,.25); z-index: 3; }
.layer.sheet { align-items: flex-end; justify-content: center; }
.layer.sheet .panel { width: min(640px, 100%); max-height: calc(100% - max(18px, env(safe-area-inset-top, 0px))); border-radius: 26px 26px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.layer.full .panel { width: 100%; height: 100%; padding-top: env(safe-area-inset-top, 0px); border-radius: 0; border-width: 0; }
.layer.full .panel::before { box-shadow: none; }
@media (min-width: 900px) {
  .layer.sheet { align-items: center; }
  .layer.sheet .panel { border-radius: 26px; border-bottom: clamp(5px, 1.4vmin, 9px) solid #0a090b; max-height: min(860px, calc(100% - 48px)); padding-bottom: 0; }
  .layer.full { justify-content: center; align-items: center; }
  .layer.full .panel { width: min(780px, calc(100% - 48px)); height: calc(100% - 48px); border-radius: 26px; border-width: 9px; }
  .layer.full .panel::before { box-shadow: inset 0 0 0 1px rgba(230,195,116,.45); }
  .layer.full.wide .panel { width: min(1000px, calc(100% - 48px)); }
}
.grab { width: 48px; height: 5px; border-radius: 5px; background: rgba(230,195,116,.45); margin: 10px auto 0; flex: none; }
@media (min-width: 900px) { .grab { display: none; } }
/* barra del titolo: la targa dorata del nome di una carta */
.phead, .rtop.plaq { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; flex: none; margin: 10px max(10px, env(safe-area-inset-right, 0px)) 4px max(10px, env(safe-area-inset-left, 0px)); padding: 3px 4px 3px 16px; min-height: 52px;
  border-radius: 14px; background: var(--plaque); color: var(--gold-ink); box-shadow: 0 0 0 1px var(--plaque-edge), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -2px 4px rgba(0,0,0,.2), 0 4px 10px rgba(0,0,0,.35); }
.phead h2, .rtop h2 { margin: 0; flex: 1; min-width: 0; font: 700 1.18rem/1.15 var(--f-title); letter-spacing: .04em; color: var(--gold-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phead .btn, .rtop.plaq .btn { color: var(--gold-ink); background: rgba(255,255,255,.22); border-color: rgba(107,74,18,.45); }
.phead .btn.ico, .rtop.plaq .btn.ico { width: 44px; min-height: 44px; border-radius: 50%; }
.phead > .btn.ico:first-child, .rtop.plaq > .btn.ico:first-child { margin-left: -12px; }
.phead .ver, .rtop .ver { font: 600 .78rem/1 var(--f-ui); color: var(--gold-ink); background: rgba(255,255,255,.3); border-radius: 999px; padding: 6px 10px; white-space: nowrap; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.pfooter { flex: none; display: flex; gap: 8px; padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.layer.sheet .pfooter { padding-bottom: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .layer.in > .scrim { animation: fade .25s ease-out; }
  .layer.in .panel { animation: zoomin .46s var(--spring); transform-origin: var(--ox, 50%) var(--oy, 100%); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes zoomin { from { transform: scale(.25) rotate(-6deg); opacity: 0; } 40% { opacity: 1; } }
  @keyframes up { from { transform: translateY(48px); opacity: .3; } }
  .stag > * { animation: risein .45s var(--spring) both; }
  .stag > *:nth-child(2) { animation-delay: .04s; } .stag > *:nth-child(3) { animation-delay: .08s; } .stag > *:nth-child(4) { animation-delay: .12s; } .stag > *:nth-child(5) { animation-delay: .16s; } .stag > *:nth-child(6) { animation-delay: .2s; }
  @keyframes risein { from { transform: translateY(14px) scale(.97); opacity: 0; } }
}

/* elementi comuni */

.field:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--brass-soft); }
.switch { appearance: none; -webkit-appearance: none; width: 54px; height: 32px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; transition: background .25s; flex: none; margin: 0; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ddd); box-shadow: 0 1px 3px rgba(0,0,0,.45); transition: transform .3s var(--spring); }
.switch:checked { background: linear-gradient(180deg, #e9c77a, #a87a2c); }
.switch:checked::after { transform: translateX(22px); }
.switch:disabled { opacity: .45; }
.row { display: flex; align-items: center; gap: 14px; justify-content: space-between; padding: 13px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.row .t b { font-weight: 700; }
.row .t span { color: var(--mute); font-size: .9rem; }
.card { background: var(--textbox); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px; box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px rgba(230,195,116,.18); }
.empty { border: 1px dashed var(--line-2); border-radius: 16px; padding: 18px; color: var(--mute); }
h2[tabindex="-1"]:focus { outline: none; }

/* --- carte gettone (emblemi), formati, giocatori: tutte con la stessa anatomia --- */
.mcard { --cw: 150px; position: relative; flex: none; width: var(--cw); border: 0; padding: calc(var(--cw) * .045); border-radius: calc(var(--cw) * .07); background: #0b0a0c; color: #fff; text-align: left; display: block;
  box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.07); transition: transform .35s var(--spring), box-shadow .3s; }
.mcard .mf { border-radius: calc(var(--cw) * .05); padding: calc(var(--cw) * .04); display: flex; flex-direction: column; gap: calc(var(--cw) * .035); background: linear-gradient(160deg, var(--pf1), var(--pf2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); height: 100%; }
.mcard .mn { display: flex; flex-wrap: wrap; row-gap: 4px; align-items: center; gap: 3px; border-radius: 7px; padding: 5px 6px 5px 9px; background: linear-gradient(180deg, #fff, var(--pn) 40%, color-mix(in srgb, var(--pn) 80%, #000)); color: #17110b; box-shadow: 0 0 0 1px rgba(0,0,0,.5); font: 700 .9rem/1.1 var(--f-title); letter-spacing: .01em; }
.mcard .mn > span:first-child { flex: 1 0 auto; margin-right: 4px; }
.mcard .ma { position: relative; aspect-ratio: 1.38; border-radius: 3px; overflow: hidden; display: grid; place-items: center; background: radial-gradient(80% 80% at 50% 40%, var(--pa1), var(--pa2)); box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 0 0 2px rgba(255,255,255,.14); }
.mcard .ma::after { content: ""; position: absolute; inset: 0; background: radial-gradient(42% 42% at 50% 45%, color-mix(in srgb, var(--pg) 55%, transparent), transparent 70%); }
.mcard .ma svg { position: relative; z-index: 1; width: 46%; height: 60%; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 3px 5px rgba(0,0,0,.6)); }
.mcard .mt { border-radius: 5px; padding: 3px 8px; background: linear-gradient(180deg, #fff, var(--pn) 40%, color-mix(in srgb, var(--pn) 80%, #000)); color: #17110b; font: 700 .72rem/1.2 var(--f-title); box-shadow: 0 0 0 1px rgba(0,0,0,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .mx { flex: 1; border-radius: 4px; padding: 7px 8px; background: linear-gradient(180deg, #f6efdc, #e6dcc1); color: #2a2014; font: 400 .8rem/1.3 var(--f-read); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.mcard .mx i { color: #5a4a33; }
.mcard .pt { position: absolute; right: calc(var(--cw) * .06); bottom: calc(var(--cw) * .035); min-width: 46px; padding: 4px 8px; border-radius: 8px; background: linear-gradient(180deg, #fff, var(--pn) 40%, color-mix(in srgb, var(--pn) 75%, #000)); color: #17110b; font: 800 1.05rem/1 var(--f-title); text-align: center; box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 4px rgba(0,0,0,.5); }
.mcard[aria-pressed="true"] { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 0 3px #ffe39a, 0 0 26px rgba(255,210,120,.55), 0 16px 30px rgba(0,0,0,.5); }
.mcard:active { transform: scale(.97); }
.mana-pip { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; flex: none; color: #1a120c; background: radial-gradient(circle at 35% 30%, #fff, var(--pp) 45%, color-mix(in srgb, var(--pp) 65%, #000)); box-shadow: 0 0 0 1px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.5); }
.mana-pip svg { width: 70%; height: 70%; }
.carousel { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 14px 18px 18px; margin: 0 -16px; scrollbar-width: none; scroll-padding: 0 18px; }
.carousel::-webkit-scrollbar { display: none; }
.carousel > * { scroll-snap-align: center; }
.carousel .mcard { --cw: min(62vw, 210px); }

/* gettoni di partita (monarca, iniziativa, giorno/notte) */
.emb { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px; border-radius: 18px; background: var(--textbox); border: 1px solid var(--line); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px rgba(230,195,116,.15); }
.emb .tk { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 38% 30%, #fff3c4, #e2b85c 45%, #8a5f18 85%); color: #2a1a05; box-shadow: 0 0 0 2px #2a1a05, 0 0 0 4px #c99a45, 0 6px 14px rgba(0,0,0,.5); }
.emb .tk svg { width: 34px; height: 34px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.emb h3 { margin: 0 0 6px; font: 700 1.05rem/1.2 var(--f-title); letter-spacing: .04em; }
.who { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 700; font-size: .95rem; color: var(--ink); transition: transform .25s var(--spring); }
.pchip .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #1a120c; background: radial-gradient(circle at 35% 30%, #fff, var(--pp) 45%, color-mix(in srgb, var(--pp) 65%, #000)); box-shadow: 0 0 0 1px rgba(0,0,0,.5); flex: none; }
.pchip .dot svg { width: 66%; height: 66%; }
.pchip[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(180deg, rgba(230,195,116,.25), rgba(230,195,116,.08)); box-shadow: 0 0 0 1px var(--gold), 0 0 14px rgba(230,195,116,.3); transform: translateY(-2px); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--mute); font-size: .92rem; border-top: 1px solid var(--line); padding-top: 12px; }
.meta b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

/* setup: numero di giocatori come gemme, giocatori come righe-carta */
.gems { display: flex; gap: 8px; flex-wrap: wrap; }
.gem { width: 52px; height: 52px; border: 0; border-radius: 50%; font: 800 1.2rem/1 var(--f-title); color: var(--ink); background: radial-gradient(circle at 38% 30%, var(--raised), var(--sunken)); box-shadow: inset 0 0 0 1px var(--line-2), 0 3px 8px rgba(0,0,0,.3); transition: transform .3s var(--spring); }
.gem[aria-pressed="true"] { color: var(--gold-ink); background: radial-gradient(circle at 38% 30%, #fff3c4, #e2b85c 45%, #8a5f18 90%); box-shadow: 0 0 0 2px #2a1a05, 0 0 0 4px #c99a45, 0 0 16px rgba(230,195,116,.5); transform: scale(1.06); }
.gem.wide { width: auto; min-width: 52px; padding: 0 14px; border-radius: 999px; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seatopt { border: 1px solid var(--line-2); border-radius: 16px; background: var(--textbox); padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); min-height: 120px; transition: transform .3s var(--spring); }
.seatopt svg { width: 64px; height: 64px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.seatopt[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(230,195,116,.25); color: var(--gold); }
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { position: relative; display: grid; gap: 10px; padding: 10px; border-radius: 16px; background: #0b0a0c; }
.prow::before { content: ""; position: absolute; inset: 4px; border-radius: 12px; background: linear-gradient(160deg, var(--pf1), var(--pf2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
.prow > * { position: relative; }
.prow .field { background: linear-gradient(180deg, #fff, var(--pn) 40%, color-mix(in srgb, var(--pn) 82%, #000)); color: #17110b; border: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.5); font: 700 1.02rem/1 var(--f-title); }
.prow .field::placeholder { color: #4d4335; }
.prow .mpick { justify-content: flex-start; gap: 6px; padding: 0 4px; }
.prow .mpick button { width: 44px; height: 44px; }
.prow .inline-check { color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); padding: 0 6px 4px; }
.inline-check { display: flex; align-items: center; gap: 10px; font-size: .95rem; color: var(--ink-2); }

/* dadi: vassoio di feltro */
#L-dice .panel { background: radial-gradient(90% 60% at 50% 40%, #2d1f45 0%, #160f23 55%, #0a0710 100%); }
.tray { position: relative; flex: 1; min-height: 260px; border-radius: 22px; overflow: hidden; touch-action: none; cursor: pointer;
  background: radial-gradient(70% 60% at 50% 45%, #3a2a5c, #1c1430 70%, #120c1f); box-shadow: inset 0 0 0 2px #6b4a12, inset 0 0 0 6px #2a1a05, inset 0 0 0 7px #c99a45, inset 0 12px 40px rgba(0,0,0,.7); }
.tray::before { content: ""; position: absolute; inset: 0; opacity: .25; background: repeating-radial-gradient(circle at 50% 50%, rgba(230,195,116,.25) 0 1px, transparent 1px 30px); pointer-events: none; }
.tray canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tray .hint { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font: 700 .8rem/1 var(--f-title); letter-spacing: .14em; text-transform: uppercase; color: rgba(246,226,170,.75); pointer-events: none; }
.dres { position: absolute; left: 0; right: 0; top: 14px; text-align: center; pointer-events: none; font: 800 1.1rem/1.2 var(--f-title); letter-spacing: .12em; color: #f6e2aa; text-shadow: 0 2px 8px #000; min-height: 1.3em; }
.dres.crit { color: #ffe39a; text-shadow: 0 0 18px rgba(255,210,100,.9), 0 2px 8px #000; }
.dres.fail { color: #ff9a8a; }
.dicebody { display: flex; flex-direction: column; gap: 14px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); flex: 1; min-height: 0; }
.dice-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.die { position: relative; min-height: 64px; border-radius: 14px; border: 1px solid rgba(230,195,116,.3); background: rgba(255,255,255,.05); color: #f4ede0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 0; font: 800 .82rem/1 var(--f-title); transition: transform .3s var(--spring); }
.die span { font-size: .7rem; letter-spacing: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.die svg { width: 30px; height: 30px; stroke: currentColor; fill: rgba(230,195,116,.15); stroke-width: 1.5; stroke-linejoin: round; }
.die[aria-pressed="true"] { border-color: #ffe39a; background: rgba(230,195,116,.18); color: #ffe39a; box-shadow: 0 0 16px rgba(230,195,116,.35); transform: translateY(-3px); }
.rolls { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.rolls span { border-radius: 999px; background: rgba(255,255,255,.07); border: 1px solid rgba(230,195,116,.3); padding: 4px 11px; font: 700 .9rem/1.2 var(--f-title); color: #e9dcc5; }
.rolls span:first-child { border-color: #ffe39a; color: #ffe39a; }
#L-dice .phead { margin-top: max(10px, env(safe-area-inset-top, 0px)); }
.coin3d { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; transform-style: preserve-3d; pointer-events: none; }
.coin3d .cf { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center;
  background: radial-gradient(circle at 38% 30%, #fff3c4, #e2b85c 40%, #8a5f18 85%); box-shadow: inset 0 0 0 6px rgba(107,74,18,.7), inset 0 0 0 9px rgba(255,240,190,.5), 0 10px 30px rgba(0,0,0,.6); color: #2a1a05; font: 800 1rem/1.1 var(--f-title); letter-spacing: .1em; }
.coin3d .cf svg { width: 58px; height: 58px; stroke: currentColor; fill: none; stroke-width: 1.7; display: block; margin: 0 auto 4px; }
.coin3d .cf.b { transform: rotateX(180deg); background: radial-gradient(circle at 38% 30%, #ffffff, #c7ccd3 40%, #5c636c 85%); box-shadow: inset 0 0 0 6px rgba(40,45,52,.7), inset 0 0 0 9px rgba(255,255,255,.5), 0 10px 30px rgba(0,0,0,.6); color: #15181c; }

/* storico */
.spark { width: 100%; height: 150px; display: block; border-radius: 14px; background: var(--textbox); border: 1px solid var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .95rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; background: var(--pp); box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.log li:first-child { border-top: 0; }
.log li i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #1a120c; background: radial-gradient(circle at 35% 30%, #fff, var(--pp) 45%, color-mix(in srgb, var(--pp) 65%, #000)); }
.log li i svg { width: 66%; height: 66%; }
.log .tm { color: var(--mute); font-size: .82rem; margin-left: 6px; font-variant-numeric: tabular-nums; }
.log .d { font: 800 1.05rem/1 var(--f-title); font-variant-numeric: lining-nums tabular-nums; }
.log .d.neg { color: var(--danger); } .log .d.pos { color: var(--ok); }

/* impostazioni */
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { min-width: 50px; height: 46px; padding: 0 14px; border-radius: 999px; border: 0; font: 800 1rem/1 var(--f-title); color: var(--ink); background: radial-gradient(circle at 38% 30%, var(--raised), var(--sunken)); box-shadow: inset 0 0 0 1px var(--line-2); transition: transform .3s var(--spring); }
.pill[aria-pressed="true"] { color: var(--gold-ink); background: radial-gradient(circle at 38% 30%, #fff3c4, #e2b85c 45%, #8a5f18 95%); box-shadow: 0 0 0 2px #2a1a05, 0 0 0 4px #c99a45; transform: scale(1.04); }
.pill svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; vertical-align: middle; }
.ltrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 13px 0; border-top: 1px solid var(--line); }
.ltrow:first-child { border-top: 0; }
.ltrow > span, .ltrow > label { font-weight: 700; }
.ltrow .t { display: flex; flex-direction: column; } .ltrow .t small { color: var(--mute); font-size: .88rem; font-weight: 400; }

/* ================= ARBITRO ================= */
.rhead { padding: 0 0 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); flex: none; }
.rhead > form, .rhead > .rtabs { margin: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
.rtop { display: flex; align-items: center; gap: 6px; }
.rsearch { display: flex; align-items: flex-start; gap: 10px; border-radius: 16px; border: 1px solid rgba(230,195,116,.45); background: var(--sunken); padding: 0 6px 0 14px; color: var(--mute); box-shadow: 0 0 0 0 rgba(230,195,116,0); transition: box-shadow .3s; }
.rsearch:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px var(--brass-soft), 0 0 22px rgba(230,195,116,.2); }
.rsearch svg { margin-top: 15px; color: var(--gold); }
.rsearch textarea { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); resize: none; font-size: 1.04rem; line-height: 1.45; padding: 13px 0; min-height: 50px; max-height: 30vh; }
.rsearch .btn { margin-top: 5px; }
.rtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.rtabs button { border: 0; background: transparent; color: var(--mute); font: 700 .86rem/1 var(--f-title); letter-spacing: .06em; padding: 0 14px; border-radius: 10px 10px 4px 4px; min-height: 42px; white-space: nowrap; position: relative; }
.rtabs button[aria-pressed="true"] { color: var(--gold-ink); background: var(--plaque); box-shadow: 0 0 0 1px var(--plaque-edge); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 6px 0 12px; border-radius: 999px; border: 0; background: var(--brass-soft); color: var(--ink); font-size: .9rem; box-shadow: inset 0 0 0 1px rgba(230,195,116,.3); }
.term small { color: var(--mute); }
.term .x { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); font-size: 1rem; }
.term.off { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--mute); text-decoration: line-through; }
.term.unk { background: transparent; box-shadow: none; border: 1px dashed var(--line-2); color: var(--mute); padding-right: 12px; }
.res { display: flex; flex-direction: column; gap: 10px; }
.rc { position: relative; border-radius: 16px; border: 1px solid var(--line); background: var(--textbox); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: border-color .15s, transform .25s var(--spring); }
.rc:hover { border-color: var(--line-2); }
.rc:active { transform: scale(.985); }
.rc.best { border-color: rgba(230,195,116,.6); padding: 18px; box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px rgba(230,195,116,.35), 0 10px 26px rgba(0,0,0,.3); }
.rc .eye { font: 700 .74rem/1 var(--f-title); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.rc .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.num { font: 500 .95rem/1.2 var(--f-mono); color: var(--gold); }
.rc .hd .num { padding: 3px 9px; border-radius: 999px; background: var(--brass-soft); box-shadow: inset 0 0 0 1px rgba(230,195,116,.35); }
.rc.best .num { font-size: 1.05rem; }
.crumb { font-size: .82rem; color: var(--mute); overflow-wrap: anywhere; }
.rt { margin: 0; font: 400 1.06rem/1.62 var(--f-read); color: var(--ink); overflow-wrap: anywhere; }
.rc:not(.best) .rt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.en { margin: 0; font: italic 400 .94rem/1.5 var(--f-read); color: var(--mute); overflow-wrap: anywhere; border-left: 2px solid var(--line-2); padding-left: 10px; }
.ex { margin: 0; font: 400 .97rem/1.55 var(--f-read); color: var(--ink-2); border-left: 3px solid rgba(230,195,116,.35); padding-left: 12px; overflow-wrap: anywhere; }
.ex b { font-family: var(--f-title); font-weight: 700; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-right: 6px; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; }
.ref { font: 500 .9em var(--f-mono); color: var(--gold); background: none; border: 0; padding: 0; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.gbox { border-radius: 16px; border: 1px solid var(--line); background: var(--textbox); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
/* la sentenza dell'arbitro */
.ans { position: relative; border-radius: 18px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; color: #2a2014;
  background: linear-gradient(180deg, #f8f1de, #eadfc3); box-shadow: 0 0 0 1px #6b4a12, inset 0 0 0 3px #f8f1de, inset 0 0 0 4px rgba(155,117,51,.6), 0 12px 30px rgba(0,0,0,.35); }
.ans .lbl { color: #6b4a12; } .ans .lbl::before { background: #6b4a12; } .ans .lbl::after { background: linear-gradient(90deg, rgba(107,74,18,.5), transparent); }
.ans p { margin: 0; font: 400 1.08rem/1.58 var(--f-read); color: #2a2014; }
.ans mark { background: rgba(214,160,50,.35); color: #2a2014; }
.ans .refs { display: flex; flex-wrap: wrap; gap: 6px; }
.ans .refs .ref { text-decoration: none; color: #5a3c08; border: 1px solid #9b7533; background: rgba(255,255,255,.5); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: .9rem; }
.ans .ref { color: #5a3c08; }
.gbox dl { margin: 0; }
.gbox dt { font-weight: 700; margin-top: 10px; font-family: var(--f-title); letter-spacing: .02em; }

      ${settings.ltCustom ? `<div class="ltrow"><label for="lt-lifev">${t("ltCustom")}</label><span style="display:flex;gap:8px"><input class="field" id="lt-lifev" type="number" inputmode="numeric" min="1" max="999" value="${game.start}" style="width:110px"><button type="button" class="pill" data-act="lt-life-ok" aria-pressed="true">OK</button></span></div>` : ""}
      <div class="ltrow"><span>${t("ltPoison")}</span>${pills("lt-poison", [10, 15, 21], f.poison)}</div>
      ${sw("s-gameover", settings.gameOver, "ltOver", "ltOverHelp")}

    </div></div>

    <div class="sec"><h3 class="lbl">${t("stTheme")}</h3><div class="seg" role="group">${["dark", "light", "system"].map(v => `<button type="button" data-act="theme" data-v="${v}" aria-pressed="${settings.theme === v}">${t({ dark: "tDark", light: "tLight", system: "tSys" }[v])}</button>`).join("")}</div></div>
    <div class="sec"><h3 class="lbl">${t("ltApp")}</h3><div class="card">
      ${sw("s-showen", settings.showEn, "stShowEn", "stShowEnHelp")}
      ${sw("s-wake", settings.wake, "stWake", "stWakeHelp")}
      ${sw("s-haptic", settings.haptic, "stHaptic", "stHapticHelp")}
      <div class="row"><button type="button" class="btn sm" data-act="fullscreen">${icon("full", "s")}${t("fullscreen")}</button></div>
    </div></div>
    <div class="sec"><h3 class="lbl">${t("stRules")}</h3><div class="card">
      <div class="row"><div class="t"><b>${esc(t(state.custom ? "stVerCustom" : "stVer", { d: fmtDate(CR.date) }))}</b><span>${esc(t("stCount", { r: CR.rules.length.toLocaleString(settings.lang), g: CR.glossary.length, p: pct }))}</span></div></div>
      <div class="row" style="flex-wrap:wrap"><div class="t" style="flex-basis:100%"><b>${t("stUpdate")}</b><span>${t("stUpdateHelp")}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="upload">${t("stUpload")}</button><a class="btn sm flat" href="https://magic.wizards.com/en/rules" target="_blank" rel="noopener">magic.wizards.com/rules ↗</a>${state.custom ? `<button type="button" class="btn sm flat" data-act="builtin">${t("stBuiltin")}</button>` : ""}</div></div>
    </div></div>
    <div class="sec"><h3 class="lbl">${t("stData")}</h3><div><button type="button" class="btn sm" data-act="clear-recent">${t("stClear")}</button></div></div>
    <p class="note">${t("about")}</p>`;
};

function applyTheme() { document.documentElement.setAttribute("data-theme", settings.theme); }
function applyLang() {
  document.documentElement.lang = settings.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
}
function refreshAll() { applyLang(); renderBoard(); for (const s of stack) if (RENDER[s.name]) RENDER[s.name]({ keepFocus: true }); }

/* ---------------- schermo acceso ---------------- */
let wakeLock = null;
async function updateWake() {
  const want = settings.wake && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* ============================================================
   Azioni
   ============================================================ */
const state = { custom: false };
const ACT = {
  menu: () => openLayer("menu"),

  setcolor: el => { const i = +el.dataset.i; game.players[i].color = el.dataset.c; ui.view[i] = "colors"; saveGame(); renderBoard(i); buzz(8); setTimeout(() => setView(i, "life", true), 260); },

  "lt-life": el => { settings.ltCustom = false; relaunch({ life: +el.dataset.v }); },

  "lt-life-ok": () => { const v = Math.max(1, Math.min(999, parseInt($("lt-lifev").value, 10) || game.start)); settings.ltCustom = false; relaunch({ life: v }); },
  "lt-poison": el => { game.poison = +el.dataset.v; saveGame(); renderBoard(); RENDER.settings(); },
  close: () => closeTop(),
  open: el => { const l = el.dataset.l; if (l === "setup") { setup.fmt = null; } const fromRing = el.classList.contains("rcard"); openLayer(l, { replaceTop: stack.length && stack[stack.length - 1].name === "menu", focusInput: l === "rules", opener: fromRing ? $("hubm") : undefined, origin: el.getBoundingClientRect() }); },
  "who-starts": () => {
    const n = game.players.length, pick = Math.floor(rnd() * n), els = $("board").children, steps = reduceMotion() ? 0 : n * 3 + pick;

      k++; setTimeout(step, 70 + 330 * Math.pow(k / Math.max(1, steps), 2.6));

  },
  "ask-open": () => openLayer("ask", { opener: $("hub-ask") }),

  "kb-cat": el => renderKbCat(el.dataset.c),

  "ask-from-rules": () => { ask.mode = "q"; ask.q = rulesState.q.trim(); ask.card = null; ask.autoAI = true; openLayer("ask", { replaceTop: true, opener: $("hub-ask") }); },
  "ask-card": async el => { const v = el.dataset.v; if (ask.mode !== "c") { ask.mode = "c"; RENDER.ask(); } ask.q = v; $("askq").value = v; $("askbody").innerHTML = `<div class="animate-pulse rounded-2xl border border-white/5 bg-zinc-900/60 p-3 text-[13px] text-zinc-400">${esc(t("lookingFor", { n: v }))}</div>`; const seq = ++ask.seq; const r = await lookupCard(v, true); if (seq !== ask.seq) return; ask.card = r; askRun(); $("askbody").scrollTop = 0; },

  desig: el => { const k = el.dataset.k; game[k] = game[k] === el.dataset.id ? null : el.dataset.id; saveGame(); renderBoard(); RENDER.menu(); el = document.querySelector(`[data-act="desig"][data-k="${k}"][data-id="${el.dataset.id}"]`); if (el) el.focus(); },
  day: el => { game.day = el.dataset.v || null; saveGame(); placeHub(); RENDER.menu(); },
  fullscreen: () => {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().then(() => closeTop(), () => toast(t("fsFail")));
      else if (document.fullscreenElement) document.exitFullscreen().then(() => closeTop());
      else toast(t("fsFail"));
    } catch (e) { toast(t("fsFail")); }
  },
  pview: el => setView(+el.dataset.i, el.dataset.m === "life" ? "life" : el.dataset.m, true),
  cstep: el => {
    const i = +el.dataset.i, p = game.players[i], k = el.dataset.k, d = +el.dataset.d, v = Math.max(0, p.c[k] + d);
    if (v === p.c[k]) return;
    const wasOut = !!outRule(p); p.c[k] = v; logPush({ pid: p.id, k, d, v }); buzz(6); saveGame();
    const val = el.parentElement.querySelector(".val"); if (val) val.textContent = k.startsWith("tax") ? (v ? "+" + v * 2 : 0) : v;
    if (!!outRule(p) !== wasOut) $("board").children[i].classList.toggle("out", !wasOut);
  },
  cmdstep: el => {
    const i = +el.dataset.i, nv = cmdApply(i, el.dataset.o, +el.dataset.k, +el.dataset.d); if (nv == null) return;
    el.parentElement.querySelector(".val").textContent = nv; el.parentElement.classList.toggle("hot", nv >= 15);
  },
  cmdtap: el => {
    if (cmdHold.skip) { cmdHold.skip = false; return; } // il rilascio dopo la pressione lunga (−1) non conta come tocco
    const i = +el.dataset.i, o = el.dataset.o, k = el.dataset.k, kb = document.activeElement === el;
    if (cmdApply(i, o, +k, 1) != null && kb) { const n = document.querySelector(`.pl[data-i="${i}"] .cdisc[data-o="${o}"][data-k="${k}"]`); if (n) n.focus({ preventScroll: true }); }
  },
  "open-rule": el => openRule(el.dataset.id),
  select: el => { if (reader.id === el.dataset.id) return; reader.id = el.dataset.id; RENDER.reader({}); setHash(hashFor("reader"), false); },
  "rd-back": () => { const id = reader.back.pop(); if (id) { reader.id = id; reader.all = false; RENDER.reader({ scroll: true }); setHash(hashFor("reader"), false); } },
  "rd-all": () => { reader.all = !reader.all; RENDER.reader({ scroll: true }); },
  "rd-go": el => { if (!el.dataset.id) return; reader.id = el.dataset.id; reader.all = false; RENDER.reader({ scroll: true }); setHash(hashFor("reader"), false); },
  "toggle-en": el => { reader.en[el.dataset.id] = !reader.en[el.dataset.id]; if (stack.some(s => s.name === "reader") && stack[stack.length - 1].name === "reader") RENDER.reader({}); else renderRulesBody(); },
  save: el => {
    const s = store.get("saved", []), id = el.dataset.id, k = s.indexOf(id);
    if (k >= 0) s.splice(k, 1); else s.unshift(id);
    store.set("saved", s); buzz(8);
    document.querySelectorAll(`[data-act="save"][data-id="${id}"]`).forEach(b => { b.setAttribute("aria-pressed", k < 0); b.querySelector("span").textContent = k < 0 ? t("saved") : t("save"); });
  },
  copy: el => {
    const r = CR.byId[el.dataset.id], x = trRule(r);
    let txt = `${r.id} — ${x.t}${x.ex.length ? "\n" + t("example") + ": " + x.ex.join("\n" + t("example") + ": ") : ""}`;
    if (x.tr) txt += `\n\n[EN] ${r.t}`;
    txt += `\n(Magic: The Gathering Comprehensive Rules, ${CR.date})`;
    try { navigator.clipboard.writeText(txt).then(() => toast(t("copied", { id: r.id })), () => toast(t("copyFail"))); } catch (e) { toast(t("copyFail")); }
  },
  term: el => { const k = el.dataset.key; rulesState.excluded.has(k) ? rulesState.excluded.delete(k) : rulesState.excluded.add(k); renderRulesBody(); },
  ask: el => { rulesState.q = el.dataset.q; rulesState.excluded.clear(); rulesState.tab = "search"; rulesState.list = null; $("rq").value = rulesState.q; autoGrow(); remember(rulesState.q); RENDER.rules(); renderRulesBody(true); $("rbody").scrollTop = 0; },
  rclear: () => { rulesState.q = ""; $("rq").value = ""; autoGrow(); renderRulesBody(); $("rq").focus(); },

  "list-back": () => { rulesState.list = null; rulesState.filter = ""; RENDER.rules(); },

};
document.addEventListener("click", e => {
  const rc = e.target.closest(".rcard");
  if (rc) closeRing();
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (el && ACT[el.dataset.act]) {
    if ((el.dataset.act === "select" || el.classList.contains("rc")) && e.target.closest("button:not(.rc),a")) return;
    ACT[el.dataset.act](el, e); return;
  }
  const rt = e.target.closest("[data-rtab]");
  if (rt) { rulesState.tab = rt.dataset.rtab; rulesState.list = null; rulesState.filter = ""; RENDER.rules(); $("rbody").scrollTop = 0; }
});
document.addEventListener("change", e => {
  const el = e.target;
  const sw = { "s-showen": "showEn", "s-cmdlife": "cmdLife", "s-wake": "wake", "s-haptic": "haptic", "s-gameover": "gameOver" }[el.id];
  if (sw) { settings[sw] = el.checked; saveSettings(); if (sw === "wake") updateWake(); if (sw === "gameOver") renderBoard(); return; }
  if (el.id === "s-playcmd") { relaunch({ cmd: el.checked, life: el.checked && game.start < 40 ? 40 : !el.checked && game.start === 40 ? 20 : game.start }); return; }
  if (el.dataset.partner != null) { const i = +el.dataset.partner; draft(i).partner = el.checked; if (game.players[i]) { game.players[i].partner = el.checked; saveGame(); renderBoard(); } return; }
  if (el.id === "slife") setup.life = parseInt(el.value, 10) || setup.life;
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.nm != null) { const i = +el.dataset.nm, p = game.players[i]; if (p) { p.name = el.value.slice(0, 20); saveGame(); const pl = $("board").children[i], nm = pl && pl.querySelector(".nameplate .nm"); if (nm) nm.textContent = pname(p, i); if (pl) pl.setAttribute("aria-label", pname(p, i)); } return; }
  if (el.dataset.pn != null) { const i = +el.dataset.pn, v = el.value.slice(0, 20); draft(i).name = v; if (game.players[i]) { game.players[i].name = v; saveGame(); clearTimeout(ACT.nt); ACT.nt = setTimeout(() => renderBoard(), 150); } }
  if (el.id === "tfilter" || el.id === "gfilter" || el.id === "lfilter") {
    rulesState.filter = el.value; const id = el.id, pos = el.selectionStart;
    clearTimeout(rulesState.ft); rulesState.ft = setTimeout(() => { renderRulesBody(); const n = $(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }, 120);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ringOpen()) { closeRing(true); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.id === "tray") { e.preventDefault(); roll(); return; }
  if (e.key === "Escape" && stack.length) { e.preventDefault(); closeTop(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("rc")) { e.preventDefault(); openRule(e.target.dataset.id); }
  const top = stack[stack.length - 1];
  if (top && top.name === "reader" && !e.target.closest("input,textarea") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { const b = $(e.key === "ArrowLeft" ? "rd-prev" : "rd-next"); if (!b.disabled) b.click(); }
});
$("rform").addEventListener("submit", e => { e.preventDefault(); rulesState.q = $("rq").value; rulesState.tab = "search"; rulesState.list = null; remember(rulesState.q); RENDER.rules(); renderRulesBody(true); $("rq").blur(); });
$("rq").addEventListener("input", () => {
  autoGrow(); clearTimeout(rulesState.timer);
  rulesState.timer = setTimeout(() => { const v = $("rq").value; if (v.trim() !== rulesState.q.trim()) rulesState.excluded.clear(); rulesState.q = v; if (rulesState.tab !== "search" || rulesState.list) { rulesState.tab = "search"; rulesState.list = null; RENDER.rules(); } else renderRulesBody(); }, 170);
});
$("rq").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("rform").requestSubmit(); } });
$("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { loadRules(rd.result, true); if (!store.set("rules", rd.result)) toast(t("notSaved")); else toast(dateVal(CR.date) < dateVal(BUILTIN_DATE) ? t("older", { d: fmtDate(CR.date) }) : t("loaded", { d: fmtDate(CR.date) })); RENDER.settings(); }
    catch (err) { toast(err.message); }
    e.target.value = "";
  };
  rd.readAsText(f, "utf-8");
});
$("askform").addEventListener("submit", e => { e.preventDefault(); ask.q = $("askq").value; ask.card = null; remember(ask.q); askRun(true, true); $("askq").blur(); });
$("askq").addEventListener("input", () => { ask.q = $("askq").value; ask.card = null; askRun(false); clearTimeout(ask.deep); if (ask.mode === "q") ask.deep = setTimeout(() => askRun(true), 750); });
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { closeRing(); clearTimeout(window.rz); window.rz = setTimeout(() => renderBoard(), 80); });
document.addEventListener("visibilitychange", updateWake);

   Avvio
   ============================================================ */
function loadRules(text, custom) {
  CR = parseCR(text); IDX = buildIndex(CR); state.custom = custom; findRules();
  for (const s of stack) if (RENDER[s.name]) RENDER[s.name]({ keepFocus: true });
}
function boot() {
  applyTheme(); applyLang();
  const builtin = $("cr").textContent;
  BUILTIN_DATE = (builtin.match(/effective as of ([^.\n]+)\./i) || [])[1] || "";
  const custom = store.get("rules", null);
  let ok = false;
  if (custom && dateVal((custom.match(/effective as of ([^.\n]+)\./i) || [])[1]) >= dateVal(BUILTIN_DATE)) { try { CR = parseCR(custom); state.custom = true; ok = true; } catch (e) {} }
  if (!ok) { CR = parseCR(builtin); state.custom = false; }
  IDX = buildIndex(CR); findRules();
  // preparo in anticipo l'indice del Judge, così la prima domanda è immediata
  setTimeout(() => { try { kbWarm(); } catch (e) {} }, 800);
  $("sigil").innerHTML = sigilSVG();
  $("hub-ask").innerHTML = ic("scales", "size-[22px]"); $("hubm").innerHTML = `<svg class="size-7" viewBox="0 0 28 28" aria-hidden="true">${["W", "U", "B", "R", "G"].map((c, k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / 5, x = 14 + Math.cos(a) * 8.6, y = 14 + Math.sin(a) * 8.6; return `<circle cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="4.1" fill="rgb(${TINT[c].split(" ").join(",")})" stroke="#09090b" stroke-width="1.2"/>`; }).join("")}</svg>`; DIE.init($("dcv"));
  renderBoard(); bindBoard();
  if (location.hash) route();
  updateWake();
}
boot();
