<title>MTG Aulla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Segnavita per Magic: The Gathering con il regolamento ufficiale (Comprehensive Rules) consultabile in italiano e in inglese.">
<meta name="theme-color" content="#0b0d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: il tavolo da gioco occupa tutto lo schermo (pannelli giocatore ruotati verso il proprio posto, medaglione centrale);
   tutto il resto (menu, arbitro, impostazioni) sono strati che salgono dal basso o scorrono da destra sopra il tavolo.
   Toni: inchiostro scuro e ottone, i cinque colori di mana per i giocatori; testo delle regole in serif da documento. */
:root {
  --bg: #0b0d12;
  --surface: #13161e;
  --raised: #1a1e28;
  --sunken: #0f1117;
  --line: #262b37;
  --line-2: #343a49;
  --ink: #eceef3;
  --ink-2: #c9cdd8;
  --mute: #959cae;
  --brass: #d6ad62;
  --brass-ink: #1a1306;
  --brass-soft: rgba(214, 173, 98, .14);
  --mark: rgba(214, 173, 98, .32);
  --mark-ink: #fff4dc;
  --danger: #ff8a7a;
  --danger-btn: #b9342a;
  --ok: #7fd3a4;
  --focus: #f0c87a;
  --scrim: rgba(3, 4, 8, .62);
  --shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --table: #07080b;
  /* mana: [colore chiaro, colore scuro, testo] uguali in entrambi i temi */
  --W1: #f4ead0; --W2: #cdb98a; --Wt: #2a2214;
  --U1: #2a78d0; --U2: #0d3570;
  --B1: #4d405c; --B2: #18131f;
  --R1: #e05535; --R2: #7c1d10;
  --G1: #2f9a5e; --G2: #0f4a2a;
  --M1: #d9a93a; --M2: #6f4d0c;
  --C1: #8a93a6; --C2: #3c4250;
  --f-num: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root[data-theme="system"] {
  --bg: #f1f2f5; --surface: #ffffff; --raised: #f6f7f9; --sunken: #e9ebf0; --line: #dcdfe6; --line-2: #c5cad5;
  --ink: #12151d; --ink-2: #2c313d; --mute: #5a6172; --brass: #8a5f12; --brass-ink: #ffffff; --brass-soft: rgba(138, 95, 18, .1);
  --mark: rgba(214, 160, 50, .3); --mark-ink: #12151d; --danger: #b3261e; --danger-btn: #b3261e; --ok: #1d6b43; --focus: #8a5f12;
  --scrim: rgba(10, 12, 20, .4); --shadow: 0 18px 50px rgba(20, 24, 40, .16), 0 2px 6px rgba(20, 24, 40, .08); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f1f2f5; --surface: #ffffff; --raised: #f6f7f9; --sunken: #e9ebf0; --line: #dcdfe6; --line-2: #c5cad5;
  --ink: #12151d; --ink-2: #2c313d; --mute: #5a6172; --brass: #8a5f12; --brass-ink: #ffffff; --brass-soft: rgba(138, 95, 18, .1);
  --mark: rgba(214, 160, 50, .3); --mark-ink: #12151d; --danger: #b3261e; --danger-btn: #b3261e; --ok: #1d6b43; --focus: #8a5f12;
  --scrim: rgba(10, 12, 20, .4); --shadow: 0 18px 50px rgba(20, 24, 40, .16), 0 2px 6px rgba(20, 24, 40, .08); color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font: 400 16px/1.5 var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brass); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 18px; height: 18px; }
svg.i.l { width: 28px; height: 28px; }

/* ================= TAVOLO ================= */
#game { position: fixed; inset: 0; background: var(--table); }
.board { position: absolute; inset: 0; display: grid; gap: 5px; padding: max(5px, env(safe-area-inset-top, 0px)) max(5px, env(safe-area-inset-right, 0px)) max(5px, env(safe-area-inset-bottom, 0px)) max(5px, env(safe-area-inset-left, 0px)); }
.pl { position: relative; container-type: size; border-radius: 22px; overflow: hidden; color: var(--pt, #fff); background: radial-gradient(130% 110% at 50% 0%, var(--p1) 0%, var(--p2) 100%); user-select: none; -webkit-user-select: none; touch-action: manipulation; isolation: isolate; transition: filter .35s var(--ease); }
.pl::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(80% 60% at 50% 46%, rgba(255,255,255,.10), transparent 70%), repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 9px); }
.pl::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); transition: box-shadow .3s var(--ease); }
.pl.active::after { box-shadow: inset 0 0 0 3px rgba(255,255,255,.92), inset 0 0 40px rgba(255,255,255,.18); }
.pl.out { filter: saturate(.15) brightness(.5); }
.pl.flash { animation: flash .6s var(--ease); }
@keyframes flash { 40% { filter: brightness(1.6); } }
.seat { position: absolute; inset: 0; container-type: size; }
.seat.r180 { transform: rotate(180deg); }
.seat.r90, .seat.r270 { inset: auto; top: 50%; left: 50%; width: 100cqh; height: 100cqw; }
.seat.r90 { transform: translate(-50%, -50%) rotate(90deg); }
.seat.r270 { transform: translate(-50%, -50%) rotate(-90deg); }

.hit { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; color: inherit; padding: 0; display: flex; align-items: center; touch-action: manipulation; }
.hit.minus { left: 0; justify-content: flex-start; padding-left: 7cqw; }
.hit.plus { right: 0; justify-content: flex-end; padding-right: 7cqw; }
.hit::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 70% at var(--hx, 50%) 50%, rgba(255,255,255,.22), transparent 70%); opacity: 0; transition: opacity .35s; }
.hit.minus::before { --hx: 0%; } .hit.plus::before { --hx: 100%; }
.hit.press::before { opacity: 1; transition: opacity .05s; }
.hit .sign { font: 600 clamp(26px, 15cqh, 60px)/1 var(--f-num); opacity: .45; transition: opacity .2s, transform .15s var(--ease); }
.hit.press .sign { opacity: 1; transform: scale(1.3); }
.pname { position: absolute; top: max(10px, 4cqh); left: max(12px, 4cqw); max-width: 58cqw; display: inline-flex; align-items: center; gap: 6px; font: 700 clamp(12px, 6.4cqh, 18px)/1.2 var(--f-ui); letter-spacing: .02em; opacity: .92; pointer-events: none; white-space: nowrap; }
.pname span { overflow: hidden; text-overflow: ellipsis; }
.pname svg { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.lifebox { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.life { font: 800 min(54cqh, 38cqw)/.8 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; text-shadow: 0 6px 30px rgba(0,0,0,.25); transition: transform .14s var(--ease); padding-top: .06em; }
.life.k3 { font-size: min(46cqh, 28cqw); }
.life.bump { transform: scale(1.05); }
.delta { position: absolute; top: 50%; left: 50%; transform: translate(calc(min(20cqh, 15cqw) + 6cqw), -128%); font: 600 clamp(18px, 12cqh, 44px)/1 var(--f-num); background: rgba(0,0,0,.28); border-radius: 999px; padding: .12em .42em; opacity: 0; transition: opacity .25s; pointer-events: none; }
.delta.on { opacity: 1; }
.pfoot { position: absolute; left: 0; right: 0; bottom: max(8px, 3cqh); display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; padding: 0 max(8px, 3cqw); pointer-events: none; }
.pbtn { pointer-events: auto; width: clamp(40px, 15cqh, 50px); height: clamp(40px, 15cqh, 50px); border-radius: 50%; border: 0; background: rgba(0,0,0,.24); color: inherit; display: grid; place-items: center; transition: background .15s, transform .15s var(--ease); }
.pbtn:active { transform: scale(.92); background: rgba(0,0,0,.4); }
.pbtn svg { width: 52%; height: 52%; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.pbtn.ghost { visibility: hidden; }
.chips { pointer-events: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; min-width: 0; flex: 1; max-height: 24cqh; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 3px; border: 0; color: inherit; background: rgba(0,0,0,.26); border-radius: 999px; padding: 3px 9px 3px 7px; font: 600 clamp(12px, 6.6cqh, 18px)/1.1 var(--f-num); letter-spacing: .02em; min-height: 30px; }
.chip svg { width: 1.1em; height: 1.1em; stroke: currentColor; fill: none; stroke-width: 2; }
.chip.hot { background: rgba(0,0,0,.55); box-shadow: 0 0 0 2px var(--brass); }
.chip i { font-style: normal; opacity: .7; font-family: var(--f-ui); font-size: .8em; font-weight: 600; }
.outtag { position: absolute; left: 50%; top: calc(50% + min(28cqh, 20cqw)); transform: translateX(-50%); pointer-events: auto; border: 0; background: rgba(0,0,0,.72); color: #fff; border-radius: 999px; padding: 6px 14px; font: 700 clamp(11px, 5.6cqh, 15px)/1.2 var(--f-ui); white-space: nowrap; min-height: 32px; display: inline-flex; gap: 6px; align-items: center; }
.outtag b { font-family: var(--f-mono); font-weight: 500; color: var(--brass); }

/* vista locale del pannello (segnalini, danni da comandante) */
.pview { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(8px, 3cqh) max(10px, 3cqw); gap: max(6px, 2cqh); background: rgba(0,0,0,.34); backdrop-filter: blur(2px); }
.pview header { display: flex; align-items: center; gap: 8px; font: 700 clamp(12px, 6cqh, 17px)/1.2 var(--f-ui); }
.pview header span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdone { border: 0; border-radius: 999px; background: #fff; color: #111; font: 700 clamp(12px, 5.6cqh, 15px)/1 var(--f-ui); padding: 0 16px; min-height: clamp(34px, 13cqh, 44px); }
.cgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(max(118px, 28cqw), 1fr)); grid-auto-rows: minmax(0, 1fr); gap: max(5px, 1.6cqh); overflow: auto; }
.cell { position: relative; border-radius: 14px; background: rgba(0,0,0,.28); display: grid; grid-template-columns: auto 1fr auto; align-items: center; min-height: 52px; overflow: hidden; }
.cell .lab { position: absolute; top: 5px; left: 0; right: 0; text-align: center; font: 600 clamp(10px, 4.6cqh, 13px)/1.1 var(--f-ui); opacity: .85; display: flex; align-items: center; justify-content: center; gap: 4px; pointer-events: none; padding: 0 8px; white-space: nowrap; overflow: hidden; }
.cell .lab svg { width: 1.2em; height: 1.2em; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }
.cell .val { text-align: center; font: 800 clamp(22px, 15cqh, 52px)/1 var(--f-num); font-variant-numeric: tabular-nums; padding-top: 10px; pointer-events: none; }
.cell button { border: 0; background: transparent; color: inherit; height: 100%; min-width: 44px; width: clamp(44px, 12cqw, 64px); font: 600 clamp(20px, 10cqh, 34px)/1 var(--f-num); }
.cell button:active { background: rgba(255,255,255,.12); }
.cell.cmd { background: radial-gradient(120% 120% at 50% 0%, var(--p1), var(--p2)); color: var(--pt, #fff); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.cell.cmd.hot { box-shadow: inset 0 0 0 3px #fff; }
.pnote { font: 500 clamp(10px, 4.4cqh, 13px)/1.3 var(--f-ui); opacity: .85; text-align: center; }

/* medaglione centrale */
.hub { position: fixed; z-index: 5; width: 68px; height: 68px; border-radius: 50%; transform: translate(-50%, -50%); border: 0; padding: 0; background: radial-gradient(circle at 50% 35%, #2a2f3c, #12141b); color: #f6ead0; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--table), 0 0 0 6px var(--hubc, var(--brass)), 0 10px 30px rgba(0,0,0,.6); transition: transform .18s var(--ease), box-shadow .3s; }
.hub:active { transform: translate(-50%, -50%) scale(.92); }
.hub .t { font: 800 1.45rem/1 var(--f-num); letter-spacing: .02em; }
.hub .t small { font: 700 .62rem/1 var(--f-ui); letter-spacing: .12em; display: block; text-align: center; opacity: .7; margin-bottom: 2px; }
.hub .dn { position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; border-radius: 50%; background: #12141b; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--table); }
.hub .dn svg { width: 15px; height: 15px; stroke: #f6ead0; fill: none; stroke-width: 2; }

/* ================= STRATI ================= */
.layer { position: fixed; inset: 0; z-index: 20; display: flex; }
.layer > .scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel { position: relative; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); }
.layer.sheet { align-items: flex-end; justify-content: center; }
.layer.sheet .panel { width: min(640px, 100%); max-height: calc(100% - max(18px, env(safe-area-inset-top, 0px))); border-radius: 24px 24px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.layer.full .panel { width: 100%; height: 100%; padding-top: env(safe-area-inset-top, 0px); }
@media (min-width: 900px) {
  .layer.sheet { align-items: center; }
  .layer.sheet .panel { border-radius: 24px; max-height: min(860px, calc(100% - 48px)); padding-bottom: 0; }
  .layer.full { justify-content: flex-end; }
  .layer.full .panel { width: min(760px, 100%); }
  .layer.full.wide .panel { width: min(980px, 100%); }
}
.grab { width: 44px; height: 5px; border-radius: 5px; background: var(--line-2); margin: 10px auto 2px; flex: none; }
@media (min-width: 900px) { .grab { display: none; } }
.phead { display: flex; align-items: center; gap: 8px; padding: 10px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); flex: none; }
.phead h2 { margin: 0; font: 700 1.15rem/1.2 var(--f-ui); flex: 1; min-width: 0; letter-spacing: .01em; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 22px; }
.pfooter { flex: none; display: flex; gap: 8px; padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.layer.sheet .pfooter { padding-bottom: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .layer.in > .scrim { animation: fade .22s ease-out; }
  .layer.sheet.in .panel { animation: up .32s var(--ease); }
  .layer.full.in .panel { animation: up .32s var(--ease); }
  @media (min-width: 900px) { .layer.full.in .panel { animation: side .3s var(--ease); } .layer.sheet.in .panel { animation: pop .26s var(--ease); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(48px); opacity: .3; } }
  @keyframes side { from { transform: translateX(48px); opacity: .3; } }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .stag > * { animation: rise .3s var(--ease) both; }
  .stag > *:nth-child(2) { animation-delay: .03s; } .stag > *:nth-child(3) { animation-delay: .06s; } .stag > *:nth-child(4) { animation-delay: .09s; } .stag > *:nth-child(5) { animation-delay: .12s; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } }
}

/* elementi comuni */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--raised); color: var(--ink); font: 600 .95rem/1.1 var(--f-ui); text-decoration: none; transition: transform .12s var(--ease), border-color .15s, background .15s; }
.btn:active { transform: scale(.97); }
.btn:hover { border-color: var(--brass); }
.btn.pri { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.danger { background: var(--danger-btn); border-color: var(--danger-btn); color: #fff; }
.btn.flat { background: transparent; border-color: transparent; }
.btn.flat:hover { background: var(--raised); }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .86rem; border-radius: 11px; }
.btn.ico { width: 46px; padding: 0; }
.btn.grow { flex: 1; }
.btn[aria-pressed="true"] { border-color: var(--brass); background: var(--brass-soft); color: var(--brass); }
.lbl { margin: 0; font: 700 .72rem/1.2 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.sec { display: flex; flex-direction: column; gap: 10px; }
.note { margin: 0; color: var(--mute); font-size: .86rem; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--sunken); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { flex: 1 1 auto; border: 0; background: transparent; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 600; font-size: .92rem; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 0 var(--line-2), 0 4px 12px rgba(0,0,0,.18); }
.field { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--sunken); padding: 0 14px; color: var(--ink); }
.field:focus { border-color: var(--brass); outline: none; box-shadow: 0 0 0 3px var(--brass-soft); }
.switch { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; transition: background .2s; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .22s var(--ease); }
.switch:checked { background: var(--brass); }
.switch:checked::after { transform: translateX(20px); }
.row { display: flex; align-items: center; gap: 14px; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .t { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.row .t b { font-weight: 600; }
.row .t span { color: var(--mute); font-size: .86rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px 16px; }
.empty { border: 1px dashed var(--line-2); border-radius: 16px; padding: 18px; color: var(--mute); }

/* menu */
.msearch { display: flex; align-items: center; gap: 10px; min-height: 54px; border-radius: 16px; border: 1px solid var(--line-2); background: var(--sunken); padding: 0 8px 0 14px; color: var(--mute); }
.msearch:focus-within { border-color: var(--brass); box-shadow: 0 0 0 3px var(--brass-soft); }
.msearch input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--ink); min-height: 50px; font-size: 1rem; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tile { overflow-wrap: anywhere; hyphens: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; min-height: 86px; padding: 10px 6px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 .82rem/1.2 var(--f-ui); text-align: center; transition: transform .12s var(--ease), border-color .15s; }
.tile:hover { border-color: var(--brass); }
.tile:active { transform: scale(.96); }
.tile svg { width: 28px; height: 28px; color: var(--brass); }
.tile small { color: var(--mute); font-weight: 500; font-size: .74rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile.hero { background: linear-gradient(160deg, var(--brass-soft), transparent 70%), var(--surface); border-color: var(--line-2); }
@media (max-width: 380px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
h2[tabindex="-1"]:focus { outline: none; }
.who { display: flex; flex-wrap: wrap; gap: 6px; }

function parseCR(text) {

  }
  if (start < 0 || gStart < 0) throw new Error(settings.lang === "it" ? "Il file non sembra il regolamento ufficiale." : "This doesn't look like the official rules file.");

    let x;
    if ((x = l.match(/^(\d)\. ([\s\S]+)$/))) { chapters.push({ n: x[1], t: x[2], secs: [] }); continue; }

      last.sub = /[a-z]$/.test(x[1]); last.parent = last.sub ? x[1].replace(/[a-z]$/, "") : null;

    }
    if ((x = l.match(/^Example:\s*([\s\S]*)$/))) { if (last) last.ex.push(x[1]); continue; }

RENDER.history = () => {
  const lab = e => e.k === "life" ? t("life") : e.k === "cmd" ? t("cmdDmg") : t(e.k);
  const ps = game.players;
  // ricostruisco la vita nel tempo andando a ritroso dal valore attuale
  const series = ps.map(p => { const pts = [p.life]; let v = p.life; for (const e of game.log) if (e.pid === p.id && e.k === "life") { v -= e.d; pts.unshift(v); } return pts; });

  const W = 600, H = 120, pad = 6, X = i => pad + i * (W - 2 * pad) / (maxLen - 1), Y = v => H - pad - (v - lo) * (H - 2 * pad) / (hi - lo || 1);

  const zero = lo < 0 ? `<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-2)" stroke-dasharray="4 4"/>` : "";
  $("hist-body").innerHTML = `<div class="sec"><h3 class="lbl">${t("lifeChart")}</h3>
      <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(t("lifeChart"))}">${zero}${paths}</svg>
      <div class="legend">${ps.map((p, i) => `<span style="${pcVars(p.color)}"><i></i>${esc(pname(p, i))} <b>${p.life}</b></span>`).join("")}</div></div>
    <div class="sec"><div class="rtop"><h3 class="lbl" style="flex:1">${t("history")}</h3>${game.log.length ? `<button type="button" class="btn sm" data-act="undo">${icon("undo", "s")}${t("undo")}</button>` : ""}</div>
    ${game.log.length ? `<ul class="log">${game.log.slice(0, 80).map(e => { const j = ps.findIndex(p => p.id === e.pid); if (j < 0) return ""; const tm = new Date(e.at).toLocaleTimeString(settings.lang, { hour: "2-digit", minute: "2-digit" });

  const p = game.players[i];
  if (e.k === "life") p.life -= e.d;
  else if (e.k === "cmd") { const v = p.cmd[e.src] || [0, 0]; v[e.slot] = Math.max(0, v[e.slot] - e.d); p.cmd[e.src] = v; if (e.withLife) { const nx = game.log[0]; if (nx && nx.k === "life" && nx.pid === p.id) { p.life -= nx.d; game.log.shift(); } } }
  else p.c[e.k] = Math.max(0, p.c[e.k] - e.d);
  saveGame(); renderBoard(); RENDER.history(); toast(t("undone"));
}

/* ---------------- impostazioni ---------------- */
RENDER.settings = () => {
  const pct = Math.round(100 * CR.translated / CR.rules.length);
  const sw = (id, on, a, b) => `<div class="row"><div class="t"><b id="${id}-l">${t(a)}</b><span>${t(b)}</span></div><input type="checkbox" class="switch" id="${id}" role="switch" aria-labelledby="${id}-l" ${on ? "checked" : ""}></div>`;
  $("set-body").innerHTML = `
    <div class="sec"><h3 class="lbl">${t("stLang")}</h3><div class="seg" role="group"><button type="button" data-act="lang" data-v="it" aria-pressed="${settings.lang === "it"}">Italiano</button><button type="button" data-act="lang" data-v="en" aria-pressed="${settings.lang === "en"}">English</button></div><p class="note">${t("stLangHelp")}</p></div>
    <div class="sec"><h3 class="lbl">${t("stTheme")}</h3><div class="seg" role="group">${["dark", "light", "system"].map(v => `<button type="button" data-act="theme" data-v="${v}" aria-pressed="${settings.theme === v}">${t({ dark: "tDark", light: "tLight", system: "tSys" }[v])}</button>`).join("")}</div></div>
    <div class="card">
      ${sw("s-showen", settings.showEn, "stShowEn", "stShowEnHelp")}
      ${sw("s-cmdlife", settings.cmdLife, "stCmdLife", "stCmdLifeHelp")}
      ${sw("s-wake", settings.wake, "stWake", "stWakeHelp")}
      ${sw("s-haptic", settings.haptic, "stHaptic", "stHapticHelp")}
    </div>
    <div class="sec"><h3 class="lbl">${t("stRules")}</h3><div class="card">
      <div class="row"><div class="t"><b>${esc(t(state.custom ? "stVerCustom" : "stVer", { d: fmtDate(CR.date) }))}</b><span>${esc(t("stCount", { r: CR.rules.length.toLocaleString(settings.lang), g: CR.glossary.length, p: pct }))}</span></div></div>
      <div class="row" style="flex-wrap:wrap"><div class="t" style="flex-basis:100%"><b>${t("stUpdate")}</b><span>${t("stUpdateHelp")}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm" data-act="upload">${t("stUpload")}</button><a class="btn sm flat" href="https://magic.wizards.com/en/rules" target="_blank" rel="noopener">magic.wizards.com/rules ↗</a>${state.custom ? `<button type="button" class="btn sm flat" data-act="builtin">${t("stBuiltin")}</button>` : ""}</div></div>
    </div></div>
    <div class="sec"><h3 class="lbl">${t("stData")}</h3><div><button type="button" class="btn sm" data-act="clear-recent">${t("stClear")}</button></div></div>
    <p class="note">${t("about")}</p>`;
};
function applyTheme() { document.documentElement.setAttribute("data-theme", settings.theme); }
function applyLang() {
  document.documentElement.lang = settings.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
}
function refreshAll() { applyLang(); renderBoard(); for (const s of stack) if (RENDER[s.name]) RENDER[s.name]({ keepFocus: true }); }

/* ---------------- schermo acceso ---------------- */
let wakeLock = null;
async function updateWake() {
  const want = settings.wake && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}

/* ============================================================
   Azioni
   ============================================================ */
const state = { custom: false };
const ACT = {
  menu: () => openLayer("menu"),
  close: () => closeTop(),
  open: el => { const l = el.dataset.l; if (l === "setup") { setup.fmt = null; } openLayer(l, { replaceTop: stack.length && stack[stack.length - 1].name === "menu", focusInput: l === "rules" }); },
  pass: () => {
    const n = game.players.length, from = game.active, to = nextActive(), first = game.first || 0;
    for (let k = from + 1; ; k++) { if (k % n === first) { game.turn++; break; } if (k % n === to) break; }
    game.active = to;
    saveGame(); closeTop(); renderBoard(); buzz(14);
    const p = game.players[game.active]; toast(t("turnToast", { n: game.turn, p: pname(p, game.active) }));
    const el = $("board").children[game.active]; if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  },
  "who-starts": () => {
    closeTop();
    const n = game.players.length, pick = Math.floor(rnd() * n), els = $("board").children, steps = reduceMotion() ? 0 : n * 2 + pick;
    let k = 0;
    const iv = setInterval(() => {
      [...els].forEach((el, j) => el.classList.toggle("active", j === k % n)); buzz(4);
      if (k >= steps) { clearInterval(iv); game.active = pick; game.first = pick; game.turn = 1; saveGame(); renderBoard(); const el = els[pick]; if (el) el.classList.add("flash"); toast(t("started", { p: pname(game.players[pick], pick) })); }
      k++;
    }, 120);
  },
  desig: el => { const k = el.dataset.k; game[k] = game[k] === el.dataset.id ? null : el.dataset.id; saveGame(); renderBoard(); RENDER.menu(); el = document.querySelector(`[data-act="desig"][data-k="${k}"][data-id="${el.dataset.id}"]`); if (el) el.focus(); },
  day: el => { game.day = el.dataset.v || null; saveGame(); placeHub(); RENDER.menu(); },
  fullscreen: () => {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().then(() => closeTop(), () => toast(t("fsFail")));
      else if (document.fullscreenElement) document.exitFullscreen().then(() => closeTop());
      else toast(t("fsFail"));
    } catch (e) { toast(t("fsFail")); }
  },
  pview: el => { const i = +el.dataset.i; ui.view[i] = el.dataset.m === "life" ? "life" : el.dataset.m; renderBoard(i); buzz(6); const f = $("board").children[i].querySelector(ui.view[i] === "life" ? ".pbtn" : ".pdone"); if (f && el.matches(":focus-visible")) f.focus(); },
  cstep: el => {
    const i = +el.dataset.i, p = game.players[i], k = el.dataset.k, d = +el.dataset.d, v = Math.max(0, p.c[k] + d);
    if (v === p.c[k]) return;
    const wasOut = !!outRule(p); p.c[k] = v; logPush({ pid: p.id, k, d, v }); buzz(6); saveGame();
    const val = el.parentElement.querySelector(".val"); if (val) val.textContent = k.startsWith("tax") ? (v ? "+" + v * 2 : 0) : v;
    if (!!outRule(p) !== wasOut) $("board").children[i].classList.toggle("out", !wasOut);
  },
  cmdstep: el => {
    const i = +el.dataset.i, p = game.players[i], o = el.dataset.o, k = +el.dataset.k, d = +el.dataset.d;
    const v = p.cmd[o] || [0, 0], nv = Math.max(0, v[k] + d); if (nv === v[k]) return;
    const wasOut = !!outRule(p); v[k] = nv; p.cmd[o] = v;
    if (settings.cmdLife) { p.life -= d; logPush({ pid: p.id, k: "life", d: -d, v: p.life }); }
    logPush({ pid: p.id, k: "cmd", src: o, slot: k, d, v: nv, withLife: settings.cmdLife }); buzz(8); saveGame();
    el.parentElement.querySelector(".val").textContent = nv; el.parentElement.classList.toggle("hot", nv >= 15);
    if (!!outRule(p) !== wasOut) $("board").children[i].classList.toggle("out", !wasOut);
  },
  "open-rule": el => openRule(el.dataset.id),
  select: el => { if (reader.id === el.dataset.id) return; reader.id = el.dataset.id; RENDER.reader({}); setHash(hashFor("reader"), false); },
  "rd-back": () => { const id = reader.back.pop(); if (id) { reader.id = id; reader.all = false; RENDER.reader({ scroll: true }); setHash(hashFor("reader"), false); } },
  "rd-all": () => { reader.all = !reader.all; RENDER.reader({ scroll: true }); },
  "rd-go": el => { if (!el.dataset.id) return; reader.id = el.dataset.id; reader.all = false; RENDER.reader({ scroll: true }); setHash(hashFor("reader"), false); },
  "toggle-en": el => { reader.en[el.dataset.id] = !reader.en[el.dataset.id]; if (stack.some(s => s.name === "reader") && stack[stack.length - 1].name === "reader") RENDER.reader({}); else renderRulesBody(); },
  save: el => {
    const s = store.get("saved", []), id = el.dataset.id, k = s.indexOf(id);
    if (k >= 0) s.splice(k, 1); else s.unshift(id);
    store.set("saved", s); buzz(8);
    document.querySelectorAll(`[data-act="save"][data-id="${id}"]`).forEach(b => { b.setAttribute("aria-pressed", k < 0); b.querySelector("span").textContent = k < 0 ? t("saved") : t("save"); });
  },
  copy: el => {
    const r = CR.byId[el.dataset.id], x = trRule(r);
    let txt = `${r.id} — ${x.t}${x.ex.length ? "\n" + t("example") + ": " + x.ex.join("\n" + t("example") + ": ") : ""}`;
    if (x.tr) txt += `\n\n[EN] ${r.t}`;
    txt += `\n(Magic: The Gathering Comprehensive Rules, ${CR.date})`;
    try { navigator.clipboard.writeText(txt).then(() => toast(t("copied", { id: r.id })), () => toast(t("copyFail"))); } catch (e) { toast(t("copyFail")); }
  },
  term: el => { const k = el.dataset.key; rulesState.excluded.has(k) ? rulesState.excluded.delete(k) : rulesState.excluded.add(k); renderRulesBody(); },
  ask: el => { rulesState.q = el.dataset.q; rulesState.excluded.clear(); rulesState.tab = "search"; rulesState.list = null; $("rq").value = rulesState.q; autoGrow(); remember(rulesState.q); RENDER.rules(); renderRulesBody(true); $("rbody").scrollTop = 0; },
  rclear: () => { rulesState.q = ""; $("rq").value = ""; autoGrow(); renderRulesBody(); $("rq").focus(); },
  list: el => { rulesState.list = el.dataset.list; rulesState.filter = ""; RENDER.rules(); $("rbody").scrollTop = 0; },
  "list-back": () => { rulesState.list = null; rulesState.filter = ""; RENDER.rules(); },
  fmt: el => { setup.fmt = el.dataset.f; const f = FORMATS[setup.fmt]; if (f.team) setup.n = 2; else if (setup.fmt !== "custom") { setup.life = setup.fmt === "brawl" ? (setup.n > 2 ? 30 : 25) : f.life; if (setup.fmt === "commander" && setup.n < 3) setup.n = 4; } RENDER.setup(); },
  sn: el => { setup.n = +el.dataset.n; if (setup.fmt === "brawl") setup.life = setup.n > 2 ? 30 : 25; RENDER.setup(); },
  seat: el => { game.layout = el.dataset.v; saveGame(); renderBoard(); RENDER.setup(); },
  color: el => { const i = +el.dataset.i; draft(i).color = el.dataset.c; if (game.players[i]) { game.players[i].color = el.dataset.c; saveGame(); renderBoard(); } RENDER.setup(); const b = document.querySelector(`.sw[data-i="${i}"][data-c="${el.dataset.c}"]`); if (b) b.focus(); },
  "start-game": () => {
    const f = FORMATS[setup.fmt]; const n = f.team ? 2 : setup.n;
    let life = setup.fmt === "custom" ? Math.max(1, Math.min(999, parseInt(($("slife") || {}).value, 10) || setup.life || 20)) : setup.fmt === "brawl" ? (n > 2 ? 30 : 25) : f.life;
    for (let i = 0; i < n; i++) draft(i);
    game = makeGame(setup.fmt, n, life, setup.draft);
    ui.view = {}; saveGame(); $("board").innerHTML = ""; closeTop(); renderBoard(); toast(t("newGameDone")); setup.fmt = null;
  },
  die: el => { dice.s = el.dataset.s === "coin" ? "coin" : +el.dataset.s; dice.v = null; RENDER.dice(); roll(); },
  roll: () => roll(),
  undo: () => undo(),
  lang: el => { settings.lang = el.dataset.v; saveSettings(); IDX = buildIndex(CR); refreshAll(); },
  theme: el => { settings.theme = el.dataset.v; saveSettings(); applyTheme(); RENDER.settings(); },
  upload: () => $("file").click(),
  builtin: () => { store.del("rules"); loadRules($("cr").textContent, false); toast(t("builtinBack")); RENDER.settings(); },
  "clear-recent": () => { store.set("recent", []); toast(t("cleared")); },
};
document.addEventListener("click", e => {
  if (e.target.closest("a[href]")) return;
  const el = e.target.closest("[data-act]");
  if (el && ACT[el.dataset.act]) {
    if ((el.dataset.act === "select" || el.classList.contains("rc")) && e.target.closest("button:not(.rc),a")) return;
    ACT[el.dataset.act](el, e); return;
  }
  const rt = e.target.closest("[data-rtab]");
  if (rt) { rulesState.tab = rt.dataset.rtab; rulesState.list = null; rulesState.filter = ""; RENDER.rules(); $("rbody").scrollTop = 0; }
});
document.addEventListener("change", e => {
  const el = e.target;
  const sw = { "s-showen": "showEn", "s-cmdlife": "cmdLife", "s-wake": "wake", "s-haptic": "haptic" }[el.id];
  if (sw) { settings[sw] = el.checked; saveSettings(); if (sw === "wake") updateWake(); return; }
  if (el.dataset.partner != null) { const i = +el.dataset.partner; draft(i).partner = el.checked; if (game.players[i]) { game.players[i].partner = el.checked; saveGame(); renderBoard(); } return; }
  if (el.id === "slife") setup.life = parseInt(el.value, 10) || setup.life;
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.pn != null) { const i = +el.dataset.pn, v = el.value.slice(0, 20); draft(i).name = v; if (game.players[i]) { game.players[i].name = v; saveGame(); clearTimeout(ACT.nt); ACT.nt = setTimeout(() => renderBoard(), 150); } }
  if (el.id === "tfilter" || el.id === "gfilter" || el.id === "lfilter") {
    rulesState.filter = el.value; const id = el.id, pos = el.selectionStart;
    clearTimeout(rulesState.ft); rulesState.ft = setTimeout(() => { renderRulesBody(); const n = $(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }, 120);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && stack.length) { e.preventDefault(); closeTop(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("rc")) { e.preventDefault(); openRule(e.target.dataset.id); }
  const top = stack[stack.length - 1];
  if (top && top.name === "reader" && !e.target.closest("input,textarea") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { const b = $(e.key === "ArrowLeft" ? "rd-prev" : "rd-next"); if (!b.disabled) b.click(); }
});
$("rform").addEventListener("submit", e => { e.preventDefault(); rulesState.q = $("rq").value; rulesState.tab = "search"; rulesState.list = null; remember(rulesState.q); RENDER.rules(); renderRulesBody(true); $("rq").blur(); });
$("rq").addEventListener("input", () => {
  autoGrow(); clearTimeout(rulesState.timer);
  rulesState.timer = setTimeout(() => { const v = $("rq").value; if (v.trim() !== rulesState.q.trim()) rulesState.excluded.clear(); rulesState.q = v; if (rulesState.tab !== "search" || rulesState.list) { rulesState.tab = "search"; rulesState.list = null; RENDER.rules(); } else renderRulesBody(); }, 170);
});
$("rq").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("rform").requestSubmit(); } });
$("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { loadRules(rd.result, true); if (!store.set("rules", rd.result)) toast(t("notSaved")); else toast(dateVal(CR.date) < dateVal(BUILTIN_DATE) ? t("older", { d: fmtDate(CR.date) }) : t("loaded", { d: fmtDate(CR.date) })); RENDER.settings(); }
    catch (err) { toast(err.message); }
    e.target.value = "";
  };
  rd.readAsText(f, "utf-8");
});
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { clearTimeout(window.rz); window.rz = setTimeout(() => renderBoard(), 80); });
document.addEventListener("visibilitychange", updateWake);

/* ============================================================
   Avvio
   ============================================================ */
function loadRules(text, custom) {
  CR = parseCR(text); IDX = buildIndex(CR); state.custom = custom; findRules();
  for (const s of stack) if (RENDER[s.name]) RENDER[s.name]({ keepFocus: true });
}
function boot() {
  applyTheme(); applyLang();
  const builtin = $("cr").textContent;
  BUILTIN_DATE = (builtin.match(/effective as of ([^.\n]+)\./i) || [])[1] || "";
  const custom = store.get("rules", null);
  let ok = false;
  if (custom && dateVal((custom.match(/effective as of ([^.\n]+)\./i) || [])[1]) >= dateVal(BUILTIN_DATE)) { try { CR = parseCR(custom); state.custom = true; ok = true; } catch (e) {} }
  if (!ok) { CR = parseCR(builtin); state.custom = false; }
  IDX = buildIndex(CR); findRules();
  renderBoard(); bindBoard();
  if (location.hash) route();
  updateWake();
}
boot();
</script>
